name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rpi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rpi/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Pytest
        run: pytest -q

  firmware:
    name: Firmware — build & host tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Cache PlatformIO toolchains
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Build firmware (esp32dev)
        run: pio run -e esp32dev
      - name: Host unit tests (native)
        run: pio test -e native
