; PlatformIO project for the ESP32 robot firmware.
;
;   esp32dev  — target build, Arduino framework (flashed to hardware in Phase 7)
;   native    — host build for Unity unit tests (pure logic: UART parsing, math)
;
; Build target:   pio run -e esp32dev
; Host tests:     pio test -e native
;
; `test_build_src` defaults to no, so the Arduino-only main.cpp is NOT compiled
; during native tests — host tests link only the pure-logic classes under lib/.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:native]
platform = native
build_flags =
    -std=c++17
    -Wall
    -Wextra
